<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" role="navigation" aria-label="Main navigation">
      <ul class="trigger" role="list">
        <li role="listitem">
          <a class="page-link" href="{{ "/about/" | relative_url }}">About</a>
        </li>
        <li role="listitem" class="mode-toggle-nav-item">
          <button class="mode-toggle mode-toggle-in-nav" id="modeToggle" aria-label="Switch to simple layout">
            Switch to Simple View
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
